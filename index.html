<html>
<head>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline'; worker-src 'self' blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://launchar.app/sdk/v1?key=YOUR_SDK_KEY&redirect=true"></script>
    <script src="js/mindar-image.prod.js"></script>
    <script src="js/aframe.min.js"></script>
    <script src="js/mindar-image-aframe.prod.js"></script>
</head>
<body>
<a-scene
        mindar-image="imageTargetSrc: ./targets-postcard.mind; uiError:yes; uiLoading:no; uiScanning:no; filterMinCF:0.0001; filterBeta: 0.001;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
        xr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
    <a-assets>
        <img id="kitten" src="./assets/kitten.jpeg">
        <img id="puppy" src="./assets/puppy.jpg">
        <img id="dog" src="./assets/dog.jpg">
        <img id="cat" src="./assets/cat.jpeg">
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#cat" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 1">
        <a-plane src="#dog" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 2">
        <a-plane src="#kitten" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 3">
        <a-plane src="#puppy" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
    </a-entity>
</a-scene>
</body>
</html>
